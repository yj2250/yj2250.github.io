<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人體器官功能記憶挑戰 🏥</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12161a; 
            color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #4fd1c5; 
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .info-panel {
            margin-bottom: 20px;
            font-size: 15px;
            color: #a0aec0;
            text-align: center;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 100px); 
            grid-gap: 14px;
            margin-top: 10px;
        }

        .card {
            width: 100px;
            height: 120px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;
            border-radius: 12px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card-back {
            background-color: #1e2530;
            border: 1px solid rgba(79, 209, 197, 0.2); 
        }

        .card-front {
            background-color: #f8f9fa;
            color: #1a202c;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
            transform: rotateY(180deg);
        }

        .card-front.icon-only svg {
            width: 44px;
            height: 44px;
            margin-bottom: 8px;
        }
        
        .card-front.icon-only span {
            font-size: 13px;
            color: #4a5568;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .card.matched {
            cursor: default;
            opacity: 0.25; 
            transition: opacity 0.5s;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #1e2530;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 400px;
            width: 80%;
            border: 1px solid #4fd1c5;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            color: #4fd1c5;
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .modal-content p {
            color: #cbd5e0;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            margin: 0 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-restart {
            background-color: #4fd1c5;
            color: #12161a;
        }
        .btn-restart:hover { 
            background-color: #38b2ac;
            box-shadow: 0 0 12px rgba(79, 209, 197, 0.4);
        }

        .btn-close {
            background-color: #e53e3e;
            color: white;
        }
        .btn-close:hover { background-color: #c53030; }
    </style>
</head>
<body>

    <h1>🏥 人體器官功能配對挑戰</h1>
    <div class="info-panel">
        <p>探索醫學奧秘：請找出「器官圖示」與它「最主要的功能」完成配對</p>
    </div>
    
    <div class="game-board" id="board"></div>

    <div class="modal-overlay" id="winModal">
        <div class="modal-content">
            <h2>🎉 挑戰成功</h2>
            <p>您對人體器官的功能暸若指掌，具備優秀的醫學常識！</p>
            <button class="modal-btn btn-restart" onclick="restartGame()">再玩一次</button>
            <button class="modal-btn btn-close" onclick="closePage()">關閉頁面</button>
        </div>
    </div>

<script>
    // 專屬深青綠色
    const iconColor = "#2c7a7b";
    
    // === 真正符合解剖學與意義的精緻 SVG 圖形 ===
    const dataSet = [
        // 大腦：真實的腦部腦迴路輪廓
        { id: 1, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2c-1.5 0-3 1-3 3v.5c-2 0-3.5 1.5-3.5 3.5v.5C1.5 11 1.5 13 3 14v.5c0 1.5 1 3 2.5 3.5.5 1.5 2 2.5 3.5 2.5h6c1.5 0 3-1 3.5-2.5 1.5-.5 2.5-2 2.5-3.5V14c1.5-1 1.5-3 0-4.5V9c0-2-1.5-3.5-3.5-3.5V5c0-2-1.5-3-3-3h-5z"/><path d="M12 2v20"/><path d="M9 6h3"/><path d="M9 10h3"/><path d="M9 14h3"/><path d="M9 18h3"/></svg><span>大腦</span>` },
        { id: 1, type: 'function', content: '思考、記憶與控管全身指令' },
        
        // 肺臟：正確的氣管與雙側肺葉
        { id: 2, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M12 8c-2-2-5-2-7 1v5c0 3 2 5 5 5h2V8z"/><path d="M12 8c2-2 5-2 7 1v5c0 3-2 5-5 5h-2V8z"/></svg><span>肺臟</span>` },
        { id: 2, type: 'function', content: '進行氣體交換吸入氧氣' },
        
        // 心臟：標準醫療心形
        { id: 3, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span>心臟</span>` },
        { id: 3, type: 'function', content: '跳動並泵出血液至全身' },
        
        // 肝臟：真實肝臟的楔形與右葉特徵
        { id: 4, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6c-3-2-8-2-12 0-3 1.5-4 4-4 7 0 2.5 2 4.5 4.5 4.5h5c4.5 0 8-3.5 8-8V6z"/></svg><span>肝臟</span>` }, 
        { id: 4, type: 'function', content: '代謝解毒與分泌膽汁' },
        
        // 胃部：標準消化道 J 型胃袋
        { id: 5, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4c-3 0-4 3-4 6 0 4 3 5 5 7 2 2 5 3 8 3 1.5 0 2-1 2-2.5S18.5 15 17 15c-2 0-3-1-3-3V6c0-1.5-1.5-2-3-2H9z"/></svg><span>胃部</span>` }, 
        { id: 5, type: 'function', content: '分泌胃酸初步消化食物' },
        
        // 腎臟：具備輸尿管的真實腎臟蠶豆形
        { id: 6, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3c-3 0-5 2-5 5s2 4 1 6-4 4-6 2-3-6 1-9 7-4 9-4z"/><path d="M12 11v6"/></svg><span>腎臟</span>` }, 
        { id: 6, type: 'function', content: '過濾血液並形成尿液' },
        
        // 眼睛
        { id: 7, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-8 10-8 10 8 10 8-4 8-10 8-10-8-10-8z"/><circle cx="12" cy="12" r="3"/></svg><span>眼睛</span>` },
        { id: 7, type: 'function', content: '接收光線並產生視覺' },
        
        // 耳朵：完整外耳廓形狀
        { id: 8, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6a4 4 0 0 0-7 2.5v5A3.5 3.5 0 0 0 10.5 17H12v-2h-1.5a1.5 1.5 0 0 1-1.5-1.5v-5A2 2 0 0 1 13 6h1c1 0 2 .5 2 1.5V11"/></svg><span>耳朵</span>` },
        { id: 8, type: 'function', content: '接收聲波與維持身體平衡' },
        
        // 骨骼：最直覺標準的骨頭圖案
        { id: 9, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="5" width="6" height="14"/><circle cx="8" cy="5" r="3"/><circle cx="16" cy="5" r="3"/><circle cx="8" cy="19" r="3"/><circle cx="16" cy="19" r="3"/></svg><span>骨骼</span>` },
        { id: 9, type: 'function', content: '支撐身體並保護內臟' },
        
        // 肌肉：以啞鈴完美象徵肌肉與力量
        { id: 10, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M18 5v14M4 8h4v8H4zM16 8h4v8h-4zM8 12h8"/></svg><span>肌肉</span>` }, 
        { id: 10, type: 'function', content: '收縮以產生力量與運動' },
        
        // 血液：終於修復！標準的血滴形狀
        { id: 11, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5c-3.3 0-6-2.7-6-6 0-4 6-11.5 6-11.5s6 7.5 6 11.5c0 3.3-2.7 6-6 6z"/></svg><span>血液</span>` },
        { id: 11, type: 'function', content: '運輸氧氣、養分與免疫細胞' },
        
        // 皮膚：象徵人體第一道防線的防護盾
        { id: 12, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>皮膚</span>` }, 
        { id: 12, type: 'function', content: '保護身體免受外物入侵' }
    ];

    // 卡背改為簡潔大方的加號
    const crossBackIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="#e53e3e" stroke-width="3" style="width:36px; height:36px;"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>`;

    let cardsArray = [];
    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function createBoard() {
        const board = document.getElementById('board');
        board.innerHTML = ''; 
        cardsArray = [...dataSet]; 
        shuffle(cardsArray);

        cardsArray.forEach((item) => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.matchId = item.id;

            const extraClass = item.isIcon ? 'icon-only' : '';

            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front ${extraClass}">${item.content}</div>
                    <div class="card-back">${crossBackIcon}</div>
                </div>
            `;

            card.addEventListener('click', flipCard);
            board.appendChild(card);
        });
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add('flipped');

        if (!hasFlippedCard) {
            hasFlippedCard = true;
            firstCard = this;
            return;
        }

        secondCard = this;
        checkForMatch();
    }

    function checkForMatch() {
        let isMatch = firstCard.dataset.matchId === secondCard.dataset.matchId;
        if (isMatch) {
            disableCards();
        } else {
            unflipCards();
        }
    }

    function disableCards() {
        firstCard.removeEventListener('click', flipCard);
        secondCard.removeEventListener('click', flipCard);
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        
        resetBoard();
        checkWin();
    }

    function unflipCards() {
