<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人體器官功能記憶挑戰 🏥</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 基礎米色 */
            background-color: #f5f2eb; 
            /* 魔法 1：中心微光的細緻漸層 */
            background-image: radial-gradient(circle at 50% 50%, #fdfbf7 0%, #f5f2eb 100%);
            color: #2d3748;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            /* 防止背景裝飾超出螢幕產生捲軸 */
            overflow-x: hidden; 
        }
        h1 {
            color:#4f7d7d; /* 醫療青綠色 */
            margin-bottom: 5px;
        }

        .info-panel {
            margin-bottom: 15px;
            font-size: 16px;
            color: #b0b8c4;
            text-align: center;
        }

        /* === 2. 遊戲畫布排版 === */
        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 95px); 
            grid-gap: 12px;
            margin-top: 10px;
        }

        /* === 3. 卡牌基礎與 3D 設定 === */
        .card {
            width: 95px;
            height: 110px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column; /* 讓內容垂直排列 */
            align-items: center;    /* 水平置中 */
            justify-content: center;/* 垂直置中：解決圖片太上面的問題 */
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            padding: 8px;
            box-sizing: border-box;
        }

        /* 卡牌背面：深藍灰色配醫學紅十字 */
        .card-back {
            background-color:#7b7f8a;
            color: #e53e3e; 
            font-size: 28px;
            font-weight: bold;
        }

        /* 卡牌正面：柔和象牙白 */
        .card-front {
            background-color: #f8f9fa;
            color: #2d3748;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.4;
            transform: rotateY(180deg);
        }

        /* 純圖示器官卡的特殊樣式（置中與縮放調整） */
        .card-front.icon-only {
            color: #2b6cb0; /* 質感藍色 */
        }
        
        /* 圖示放大 */
        .card-front.icon-only i {
            font-size: 34px;
            margin-bottom: 6px; /* 與下方標籤文字拉開一點距離 */
        }
        
        /* 標籤文字 */
        .card-front.icon-only span {
            font-size: 14px;
            color: #4a5568;
        }

        .card.matched {
            cursor: default;
            opacity: 0.3; 
            transition: opacity 0.5s;
        }

        /* === 4. 中央通關彈出視窗 (Modal) === */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #2d3748;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 80%;
            border: 2px solid #4fd1c5;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            color: #4fd1c5;
            margin-top: 0;
            font-size: 28px;
        }

        .modal-content p {
            color: #e2e8f0;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            margin: 0 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-restart {
            background-color: #4fd1c5;
            color: #1a1e24;
        }
        .btn-restart:hover { background-color: #38b2ac; }

        .btn-close {
            background-color: #e53e3e;
            color: white;
        }
        .btn-close:hover { background-color: #c53030; }
    </style>
</head>
<body>

    <h1>🏥 人體器官功能配對挑戰</h1>
    <div class="info-panel">
        <p>找出「器官圖案」與它「最主要的功能」來完成配對！</p>
    </div>
    
    <div class="game-board" id="board"></div>

    <div class="modal-overlay" id="winModal">
        <div class="modal-content">
           <h2>🎉 挑戰成功</h2>
            <p>您對人體器官的功能暸若指掌，具備優秀的醫學常識！</p>
            <button class="modal-btn btn-restart" onclick="restartGame()">再玩一次</button>
            <button class="modal-btn btn-close" onclick="closePage()">關閉頁面</button>
        </div>
    </div>

<script>
    // === 5. 醫學知識庫 ===
    const dataSet = [
        { id: 1, type: 'organ', isIcon: true, content: '<i class="fa-solid fa-brain"></i><br><span>大腦</span>' },
        { id: 1, type: 'function', content: '思考、記憶與控管全身指令' },
        
        { id: 2, type: 'organ', isIcon: true, content: '<i class="fa-solid fa-lungs"></i><br><span>肺臟</span>' },
        { id: 2, type: 'function', content: '進行氣體交換吸入氧氣' },
        
        { id: 3, type: 'organ', isIcon: true, content: '<i class="fa-solid fa-heart-pulse"></i><br><span>心臟</span>' },
        { id: 3, type: 'function', content: '跳動並泵出血液至全身' },
        
        { id: 4, type: 'organ', isIcon: true, content: '<i class="fa-solid fa-capsules"></i><br><span>肝臟</span>' }, 
        { id: 4, type: 'function', content: '代謝解毒與分泌膽汁' },
        
        { id: 5, type: 'organ', isIcon: true, content: '<i class="fa-solid fa-bowl-food"></i><br><span>胃部</span>' }, 
        { id: 5, type: 'function', content: '分泌胃酸初步消化食物' },
        
        { id: 6, type: 'organ', isIcon: true, content: '<i class="fa-solid fa-filter"></i><br><span>腎臟</span>' }, 
        { id: 6, type: 'function', content: '過濾血液並形成尿液' },
        
        { id: 7, type: 'organ', isIcon: true, content: '<i class="fa-solid fa-eye"></i><br><span>眼睛</span>' },
        { id: 7, type: 'function', content: '接收光線並產生視覺' },
        
        { id: 8, type: 'organ', isIcon: true, content: '<i class="fa-solid fa-ear-listen"></i><br><span>耳朵</span>' },
        { id: 8, type: 'function', content: '接收聲波與維持身體平衡' },
        
        { id: 9, type: 'organ', isIcon: true, content: '<i class="fa-solid fa-bone"></i><br><span>骨骼</span>' },
        { id: 9, type: 'function', content: '支撐身體並保護內臟' },
    
      { id: 10, type: 'organ', isIcon: true, content: '<i class="fa-solid fa-child"></i><br><span>肌肉</span>' }, // 人體運動意象
        { id: 10, type: 'function', content: '收縮以產生力量與運動' },
        
        { id: 11, type: 'organ', isIcon: true, content: '<i class="fa-solid fa-droplet"></i><br><span>血液</span>' },
        { id: 11, type: 'function', content: '運輸氧氣、養分與免疫細胞' },
        
        { id: 12, type: 'organ', isIcon: true, content: '<i class="fa-solid fa-shield-halved"></i><br><span>皮膚</span>' }, 
        { id: 12, type: 'function', content: '保護身體免受外物入侵' }
    ];

    let cardsArray = [];
    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function createBoard() {
        const board = document.getElementById('board');
        board.innerHTML = ''; 
        cardsArray = [...dataSet]; 
        shuffle(cardsArray);

        cardsArray.forEach((item) => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.matchId = item.id;

            const extraClass = item.isIcon ? 'icon-only' : '';

            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front ${extraClass}">${item.content}</div>
                    <div class="card-back">🏥</div>
                </div>
            `;

            card.addEventListener('click', flipCard);
            board.appendChild(card);
        });
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add('flipped');

        if (!hasFlippedCard) {
            hasFlippedCard = true;
            firstCard = this;
            return;
        }

        secondCard = this;
        checkForMatch();
    }

    function checkForMatch() {
        let isMatch = firstCard.dataset.matchId === secondCard.dataset.matchId;
        if (isMatch) {
            disableCards();
        } else {
            unflipCards();
        }
    }

    function disableCards() {
        firstCard.removeEventListener('click', flipCard);
        secondCard.removeEventListener('click', flipCard);
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        
        resetBoard();
        checkWin();
    }

    function unflipCards() {
        lockBoard = true;
        setTimeout(() => {
            firstCard.classList.remove('flipped');
            secondCard.classList.remove('flipped');
            resetBoard();
        }, 500); 
    }

    function resetBoard() {
        [hasFlippedCard, lockBoard] = [false, false];
        [firstCard, secondCard] = [null, null];
    }

    function checkWin() {
        const allMatched = document.querySelectorAll('.card.matched');
        if (allMatched.length === cardsArray.length) {
            setTimeout(() => {
                document.getElementById('winModal').classList.add('show');
            }, 500);
        }
    }

    function restartGame() {
        document.getElementById('winModal').classList.remove('show');
        resetBoard();
        createBoard();
    }

    function closePage() {
        window.close();
        setTimeout(() => {
            alert("由於瀏覽器安全限制，請直接手動關閉此分頁，或點擊「再玩一次」繼續挑戰！");
        }, 100);
    }

    createBoard();
</script>

</body>
</html>
