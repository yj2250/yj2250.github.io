<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人體器官功能記憶挑戰 🏥</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* === 1. 全局與科技深色背景 === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12161a; 
            color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #4fd1c5; 
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .info-panel {
            margin-bottom: 20px;
            font-size: 15px;
            color: #a0aec0;
            text-align: center;
        }

        /* === 2. 遊戲畫布排版 === */
        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 100px); 
            grid-gap: 14px;
            margin-top: 10px;
        }

        /* === 3. 卡牌精緻 3D 設定 === */
        .card {
            width: 100px;
            height: 120px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;
            border-radius: 12px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 卡牌背面：高雅暗色調 + 低飽和細緻紅十字 */
        .card-back {
            background-color: #1e2530;
            border: 1px solid rgba(79, 209, 197, 0.2); 
            color: #e53e3e;
        }

        /* 卡牌正面：極簡白底 */
        .card-front {
            background-color: #f8f9fa;
            color: #1a202c;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
            transform: rotateY(180deg);
        }

        /* 專屬圖示卡的字體與高質感青綠色設定 */
        .card-front.icon-only i {
            font-size: 38px;
            color: #2c7a7b; /* 深青綠，極具醫學科技感 */
            margin-bottom: 6px;
            display: inline-block;
        }
        
        .card-front.icon-only span {
            font-size: 13px;
            color: #4a5568;
            letter-spacing: 1px;
        }

        /* 成功配對後的優雅淡出 */
        .card.matched {
            cursor: default;
            opacity: 0.25; 
            transition: opacity 0.6s;
        }

        /* === 4. 中央通關彈出視窗 === */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #1e2530;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 400px;
            width: 80%;
            border: 1px solid #4fd1c5;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            color: #4fd1c5;
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .modal-content p {
            color: #cbd5e0;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            margin: 0 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-restart {
            background-color: #4fd1c5;
            color: #12161a;
        }
        .btn-restart:hover { 
            background-color: #38b2ac;
            box-shadow: 0 0 12px rgba(79, 209, 197, 0.4);
        }

        .btn-close {
            background-color: #e53e3e;
            color: white;
        }
        .btn-close:hover { background-color: #c53030; }
    </style>
</head>
<body>

    <h1>🏥 人體器官功能配對挑戰</h1>
    <div class="info-panel">
        <p>探索醫學奧秘：請找出「器官圖示」與它「最主要的功能」完成配對</p>
    </div>
    
    <div class="game-board" id="board"></div>

    <div class="modal-overlay" id="winModal">
        <div class="modal-content">
            <h2>🎉 挑戰成功</h2>
            <p>您對人體器官的功能暸若指掌，具備優秀的醫學常識！</p>
            <button class="modal-btn btn-restart" onclick="restartGame()">再玩一次</button>
            <button class="modal-btn btn-close" onclick="closePage()">關閉頁面</button>
        </div>
    </div>

<script>
    // === 5. 醫學知識庫（完美採用高質感知名開源 Bootstrap Icons 醫療線條圖示） ===
    const dataSet = [
        // 大腦：精美的大腦迴路幾何圖示
        { id: 1, type: 'organ', isIcon: true, content: '<i class="bi bi-cpu"></i><br><span>大腦</span>' },
        { id: 1, type: 'function', content: '思考、記憶與控管全身指令' },
        
        // 肺臟：高質感肺泡呼吸圖示
        { id: 2, type: 'organ', isIcon: true, content: '<i class="bi bi-wind"></i><br><span>肺臟</span>' },
        { id: 2, type: 'function', content: '進行氣體交換吸入氧氣' },
        
        // 心臟：標準洗鍊的醫學心跳幾何
        { id: 3, type: 'organ', isIcon: true, content: '<i class="bi bi-heart-pulse"></i><br><span>心臟</span>' },
        { id: 3, type: 'function', content: '跳動並泵出血液至全身' },
        
        // 肝臟：精緻的分子新陳代謝幾何
        { id: 4, type: 'organ', isIcon: true, content: '<i class="bi bi-capsule"></i><br><span>肝臟</span>' }, 
        { id: 4, type: 'function', content: '代謝解毒與分泌膽汁' },
        
        // 胃部：標準的胃部杯狀消化器官流線圖示
        { id: 5, type: 'organ', isIcon: true, content: '<i class="bi bi-cup-hot"></i><br><span>胃部</span>' }, 
        { id: 5, type: 'function', content: '分泌胃酸初步消化食物' },
        
        // 腎臟：過濾網、血液純化幾何圖示
        { id: 6, type: 'organ', isIcon: true, content: '<i class="bi bi-funnel"></i><br><span>腎臟</span>' }, 
        { id: 6, type: 'function', content: '過濾血液並形成尿液' },
        
        // 眼睛：極具未來科技感的精緻視網膜幾何
        { id: 7, type: 'organ', isIcon: true, content: '<i class="bi bi-eye"></i><br><span>眼睛</span>' },
        { id: 7, type: 'function', content: '接收光線並產生視覺' },
        
        // 耳朵：聲波接收弧線圖示
        { id: 8, type: 'organ', isIcon: true, content: '<i class="bi bi-ear"></i><br><span>耳朵</span>' },
        { id: 8, type: 'function', content: '接收聲波與維持身體平衡' },
        
        // 骨骼：標準人體解剖學骨骼
        { id: 9, type: 'organ', isIcon: true, content: '<i class="bi bi-segmented-nav"></i><br><span>骨骼</span>' },
        { id: 9, type: 'function', content: '支撐身體並保護內臟' },
        
        // 肌肉：經典運動力學二頭肌線條
        { id: 10, type: 'organ', isIcon: true, content: '<i class="bi bi-lightning"></i><br><span>肌肉</span>' }, 
        { id: 10, type: 'function', content: '收縮以產生力量與運動' },
        
        // 血液：精細的水滴/血滴形狀
        { id: 11, type: 'organ', isIcon: true, content: '<i class="bi bi-drop-half"></i><br><span>血液</span>' },
        { id: 11, type: 'function', content: '運輸氧氣、養分與免疫細胞' },
        
        // 皮膚：防禦盾牌防護罩，完美的防護意象
        { id: 12, type: 'organ', isIcon: true, content: '<i class="bi bi-shield-check"></i><br><span>皮膚</span>' }, 
        { id: 12, type: 'function', content: '保護身體免受外物入侵' }
    ];

    let cardsArray = [];
    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function createBoard() {
        const board = document.getElementById('board');
        board.innerHTML = ''; 
        cardsArray = [...dataSet]; 
        shuffle(cardsArray);

        cardsArray.forEach((item) => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.matchId = item.id;

            const extraClass = item.isIcon ? 'icon-only' : '';

            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front ${extraClass}">${item.content}</div>
                    <div class="card-back">
                        <i class="bi bi-plus-lg" style="font-size: 32px;"></i>
                    </div>
                </div>
            `;

            card.addEventListener('click', flipCard);
            board.appendChild(card);
        });
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add('flipped');

        if (!hasFlippedCard) {
            hasFlippedCard = true;
            firstCard = this;
            return;
        }

        secondCard = this;
        checkForMatch();
    }

    function checkForMatch() {
        let isMatch = firstCard.dataset.matchId === secondCard.dataset.matchId;
        if (isMatch) {
            disableCards();
        } else {
            unflipCards();
        }
    }

    function disableCards() {
        firstCard.removeEventListener('click', flipCard);
        secondCard.removeEventListener('click', flipCard);
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        
        resetBoard();
        checkWin();
    }

    function unflipCards() {
        lockBoard = true;
        setTimeout(() => {
            firstCard.classList.remove('flipped');
            secondCard.classList.remove('flipped');
            resetBoard();
        }, 1200); 
    }

    function resetBoard() {
        [hasFlippedCard, lockBoard] = [false, false];
        [firstCard, secondCard] = [null, null];
    }

    function checkWin() {
        const allMatched = document.querySelectorAll('.card.matched');
        if (allMatched.length === cardsArray.length) {
            setTimeout(() => {
                document.getElementById('winModal').classList.add('show');
            }, 500);
        }
    }

    function restartGame() {
        document.getElementById('winModal').classList.remove('show');
        resetBoard();
        createBoard();
    }

    function closePage() {
        window.close();
        setTimeout(() => {
            alert("由於瀏覽器安全限制，請直接手動關閉此分頁，或點擊「再玩一次」繼續挑戰！");
        }, 100);
    }

    createBoard();
</script>

</body>
</html>
