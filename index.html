<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果記憶翻牌遊戲 🍓</title>
    <style>
        /* === 1. 全局與背景樣式 === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        /* === 2. 遊戲畫布（卡牌網格） === */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 80px); /* 4行 */
            grid-gap: 15px;
            margin-top: 20px;
        }

        /* === 3. 卡牌基礎與3D效果設定 === */
        .card {
            width: 80px;
            height: 100px;
            perspective: 1000px; /* 啟動 3D 空間透視 */
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d; /* 保持子元素在 3D 空間 */
        }

        /* 當卡牌被加上 .flipped 類別時，旋轉 180 度 */
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* 卡牌的正反面共同樣式 */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* 背對觀眾時隱藏 */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        /* 卡牌背面（蓋著時） */
        .card-back {
            background-color: #2e3d52;
            color: white;
            font-size: 24px;
        }

        /* 卡牌正面（翻開時） */
        .card-front {
            background-color: #fff;
            font-size: 36px;
            transform: rotateY(180deg); /* 預先轉過去，翻過來時才會正 */
        }

        /* 成功配對時的淡出或特殊樣式（可自由變化） */
        .card.matched {
            cursor: default;
        }
    </style>
</head>
<body>

    <h1>🍓 水果記憶翻牌 🍌</h1>
    <p>試著找出所有配對的水果吧！</p>
    
    <!-- 遊戲圖板，卡牌會由 JavaScript 動態生成注入到這裡 -->
    <div class="game-board" id="board"></div>

<script>
    // === 4. JavaScript 遊戲邏輯 ===

    // 準備 8 種水果（一對所以共 16 張牌）
    const icons = ['🍎', '🍌', '🍇', '🍓', '🍉', '🍍', '🍒', '🥝'];
    let cardsArray = [...icons, ...icons]; // 複製一份，變成 16 張

    let hasFlippedCard = false; // 是否已經翻了第一張牌
    let lockBoard = false;      // 鎖定畫布（防止動畫期間玩家亂點第三張）
    let firstCard, secondCard;  // 記錄翻開的第一張與第二張牌

    // 【步驟 A】洗牌演算法 (Fisher-Yates Shuffle)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]]; // 交換位置
        }
    }

    // 【步驟 B】初始化遊戲，動態產生 HTML
    function createBoard() {
        const board = document.getElementById('board');
        shuffle(cardsArray); // 先洗牌

        cardsArray.forEach((icon) => {
            // 建立卡牌的 DOM 結構
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.icon = icon; // 儲存水果種類，用來判斷是否相同

            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">${icon}</div>
                    <div class="card-back">❓</div>
                </div>
            `;

            card.addEventListener('click', flipCard);
            board.appendChild(card);
        });
    }

    // 【步驟 C】玩家點擊翻牌的動作
    function flipCard() {
        if (lockBoard) return; // 如果畫布鎖定中，不給點
        if (this === firstCard) return; // 防止重複點擊同一張牌

        this.classList.add('flipped'); // 加上 CSS 翻轉效果

        if (!hasFlippedCard) {
            // 翻第一張牌
            hasFlippedCard = true;
            firstCard = this;
            return;
        }

        // 翻第二張牌
        secondCard = this;
        checkForMatch();
    }

    // 【步驟 D】檢查兩張牌是否配對成功
    function checkForMatch() {
        let isMatch = firstCard.dataset.icon === secondCard.dataset.icon;

        if (isMatch) {
            disableCards(); // 配對成功
        } else {
            unflipCards();  // 配對失敗，翻回去
        }
    }

    // 配對成功：移除點擊事件，並留下翻開狀態
    function disableCards() {
        firstCard.removeEventListener('click', flipCard);
        secondCard.removeEventListener('click', flipCard);
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        
        resetBoard();
        checkWin();
    }

    // 配對失敗：等一秒鐘後自動翻回去
    function unflipCards() {
        lockBoard = true; // 鎖定期間不能亂點其他牌

        setTimeout(() => {
            firstCard.classList.remove('flipped');
            secondCard.classList.remove('flipped');
            resetBoard(); // 釋放鎖定
        }, 1000); // 1000 毫秒 = 1 秒
    }

    // 每次比對完，重設變數狀態
    function resetBoard() {
        [hasFlippedCard, lockBoard] = [false, false];
        [firstCard, secondCard] = [null, null];
    }

    // 檢查是不是全部都通關了
    function checkWin() {
        const allMatched = document.querySelectorAll('.card.matched');
        if (allMatched.length === cardsArray.length) {
            setTimeout(() => {
                alert('🎉 太厲害了！你完成了所有配對！');
            }, 500);
        }
    }

    // 執行初始化
    createBoard();
</script>

</body>
</html>
