<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天中午吃什麼？世紀難題大考驗</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;

            /* ⏬ 這裡就是設定背景圖片的地方 ⏬ */
            background-image: url('https://picsum.photos/1920/1080?food'); /* 這裡放你的圖片網址 */
            background-size: cover;          /* 讓圖片完美填滿整個螢幕 */
            background-position: center;     /* 圖片置中 */
            background-repeat: no-repeat;    /* 不重複拼貼 */
            background-attachment: fixed;    /* 背景固定，不隨網頁滾動 */
        }
        .container {
            /* 調整為半透明的白色，做出質感的毛玻璃效果 */
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px); /* 讓背景圖片穿透時帶有模糊感 */
            -webkit-backdrop-filter: blur(10px);
            
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #57606f;
            font-size: 0.9rem;
            margin-bottom: 30px;
            font-weight: bold;
        }
        #result-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            border-bottom: 2px dashed #ccc;
        }
        .action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.2s ease;
            width: 100%;
        }
        .action-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(255, 107, 107, 0.4);
        }
        .slot-machine {
            animation: bounce 0.1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤔 中午吃什麼？</h1>
        <div class="subtitle">別想了，讓命運替你決定吧！</div>
        
        <div id="result-display">？？？</div>
        
        <button class="action-btn" id="spin-btn">替我決定！</button>
    </div>

    <script>
        const lunchOptions = [
            "八方雲集",
            "飯糰",
            "麥當勞 / 肯德基",
            "小籠包",
            "波奇碗",
            "義大麵 / 燉飯",
            "粥",
            "涼麵",
            "鍋燒意麵",
            "丼飯",
            "拉麵",
            "麵線羹",
            "乾脆不吃，省錢減肥！"
        ];

        const resultDisplay = document.getElementById('result-display');
        const spinBtn = document.getElementById('spin-btn');
        let isSpinning = false;

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return; // 防止重複點擊
            
            isSpinning = true;
            spinBtn.innerText = "抽取中...";
            resultDisplay.classList.add('slot-machine');
            
            let counter = 0;
            // 模擬跑馬燈滾動效果
            const interval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * lunchOptions.length);
                resultDisplay.innerText = lunchOptions[randomIndex];
                counter++;
                
                // 滾動 15 次後停止
                if (counter > 15) {
                    clearInterval(interval);
                    resultDisplay.classList.remove('slot-machine');
                    
                    // 抽出最終答案
                    const finalIndex = Math.floor(Math.random() * lunchOptions.length);
                    resultDisplay.innerText = lunchOptions[finalIndex];
                    
                    spinBtn.innerText = "再選一次！";
                    isSpinning = false;
                }
            }, 100);
        });
    </script>
</body>
</html>
