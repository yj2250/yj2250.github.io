<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人體器官功能記憶挑戰 🏥</title>
    <style>
        /* === 1. 全局與極致深色背景 === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12161a; 
            color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #4fd1c5; 
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .info-panel {
            margin-bottom: 20px;
            font-size: 15px;
            color: #a0aec0;
            text-align: center;
        }

        /* === 2. 遊戲畫布排版 === */
        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 100px); 
            grid-gap: 14px;
            margin-top: 10px;
        }

        /* === 3. 卡牌細節與 3D 設定 === */
        .card {
            width: 100px;
            height: 120px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;
            border-radius: 12px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 卡牌背面：高雅暗色調配質感紅十字 */
        .card-back {
            background-color: #1e2530;
            border: 1px solid rgba(79, 209, 197, 0.2); 
        }

        /* 卡牌正面：極簡白底 */
        .card-front {
            background-color: #f8f9fa;
            color: #1a202c;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
            transform: rotateY(180deg);
        }

        /* 專屬圖示卡的樣式 */
        .card-front.icon-only svg {
            width: 46px;
            height: 46px;
            margin-bottom: 6px;
        }
        
        .card-front.icon-only span {
            font-size: 13px;
            color: #4a5568;
            letter-spacing: 1px;
        }

        /* 成功配對後的淡出 */
        .card.matched {
            cursor: default;
            opacity: 0.25; 
            transition: opacity 0.6s;
        }

        /* === 4. 中央通關彈出視窗 (Modal) === */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #1e2530;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 400px;
            width: 80%;
            border: 1px solid #4fd1c5;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            color: #4fd1c5;
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .modal-content p {
            color: #cbd5e0;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            margin: 0 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-restart {
            background-color: #4fd1c5;
            color: #12161a;
        }
        .btn-restart:hover { 
            background-color: #38b2ac;
            box-shadow: 0 0 12px rgba(79, 209, 197, 0.4);
        }

        .btn-close {
            background-color: #e53e3e;
            color: white;
        }
        .btn-close:hover { background-color: #c53030; }
    </style>
</head>
<body>

    <h1>🏥 人體器官功能配對挑戰</h1>
    <div class="info-panel">
        <p>探索醫學奧秘：請找出「器官圖示」與它「最主要的功能」完成配對</p>
    </div>
    
    <div class="game-board" id="board"></div>

    <div class="modal-overlay" id="winModal">
        <div class="modal-content">
            <h2>🎉 挑戰成功</h2>
            <p>您對人體器官的功能暸若指掌，具備優秀的醫學常識！</p>
            <button class="modal-btn btn-restart" onclick="restartGame()">再玩一次</button>
            <button class="modal-btn btn-close" onclick="closePage()">關閉頁面</button>
        </div>
    </div>

<script>
    // === 5. 醫學知識庫（100% 正確閉合的標準高質感 SVG 線條圖示） ===
    const dataSet = [
        // 大腦
        { id: 1, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c7a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path><path d="M12 6v12"></path><path d="M6 12h12"></path></svg><span>大腦</span>` },
        { id: 1, type: 'function', content: '思考、記憶與控管全身指令' },
        
        // 肺臟
        { id: 2, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c7a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18c0-3 2-6 6-6s6 3 6 6"></path><path d="M12 6v12"></path></svg><span>肺臟</span>` },
        { id: 2, type: 'function', content: '進行氣體交換吸入氧氣' },
        
        // 心臟
        { id: 3, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c7a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span>心臟</span>` },
        { id: 3, type: 'function', content: '跳動並泵出血液至全身' },
        
        // 肝臟
        { id: 4, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c7a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9l8-6z"></path></svg><span>肝臟</span>` }, 
        { id: 4, type: 'function', content: '代謝解毒與分泌膽汁' },
        
        // 胃部（手繪精緻胃袋輪廓，完美閉合）
        { id: 5, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c7a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 6c-2-2-5-1-7 1l-4 4c-2 2-2 5 0 7s5 2 7 0l4-4c2-2 2-6 0-8z"></path><path d="M6 18l-2 2"></path></svg><span>胃部</span>` }, 
        { id: 5, type: 'function', content: '分泌胃酸初步消化食物' },
        
        // 腎臟
        { id: 6, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c7a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 0-4 4v4a4 4 0 0 0 8 0V6a4 4 0 0 0-4-4z"></path><path d="M12 14v6"></path></svg><span>腎臟</span>` }, 
        { id: 6, type: 'function', content: '過濾血液並形成尿液' },
        
        // 眼睛
        { id: 7, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c7a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg><span>眼睛</span>` },
        { id: 7, type: 'function', content: '接收光線並產生視覺' },
        
        // 耳朵
        { id: 8, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c7a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path></svg><span>耳朵</span>` },
        { id: 8, type: 'function', content: '接收聲波與維持身體平衡' },
        
        // 骨骼
        { id: 9, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c7a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"></path><path d="M5 17h14"></path><path d="M12 5v14"></path></svg><span>骨骼</span>` },
        { id: 9, type: 'function', content: '支撐身體並保護內臟' },
        
        // 肌肉（精緻線條畫出的強壯手臂二頭肌）
        { id: 10, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c7a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c2-2 3-5 1-7s-5-1-7 1l-5 5v5h5l6-4z"></path><path d="M9 13c1-2 3-3 5-1"></path></svg><span>肌肉</span>` }, 
        { id: 10, type: 'function', content: '收縮以產生力量與運動' },
        
        // 血液
        { id: 11, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c7a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-4.3-7-13-7-13S5 10.7 5 15a7 7 0 0 0 7 7z"></path></svg><span>血液</span>` },
        { id: 11, type: 'function', content: '運輸氧氣、養分與免疫細胞' },
        
        // 皮膚
        { id: 12, type: 'organ', isIcon: true, content: `<svg viewBox="0 0 24 24" fill="none" stroke="#2c7a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><span>皮膚</span>` }
    ];

    // 全免費紅十字卡背圖示
    const crossBackIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="#e53e3e" stroke-width="3" style="width:40px; height:40px;"><path d="M12 5v14M5 12h14" stroke-linecap="round"></path></svg>`;

    let cardsArray = [];
    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function createBoard() {
        const board = document.getElementById('board');
        board.innerHTML = ''; 
        cardsArray = [...dataSet]; 
        shuffle(cardsArray);

        cardsArray.forEach((item) => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.matchId = item.id;

            const extraClass = item.isIcon ? 'icon-only' : '';

            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front ${extraClass}">${item.content}</div>
                    <div class="card-back">${crossBackIcon}</div>
                </div>
            `;

            card.addEventListener('click', flipCard);
            board.appendChild(card);
        });
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add('flipped');

        if (!hasFlippedCard) {
            hasFlippedCard = true;
            firstCard = this;
            return;
        }

        secondCard = this;
        checkForMatch();
    }

    function checkForMatch() {
        let isMatch = firstCard.dataset.matchId === secondCard.dataset.matchId;
        if (isMatch) {
            disableCards();
        } else {
            unflipCards();
        }
    }

    function disableCards() {
        firstCard.removeEventListener('click', flipCard);
        secondCard.removeEventListener('click', flipCard);
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        
        resetBoard();
        checkWin();
    }

    function unflipCards() {
        lockBoard = true;
        setTimeout(() => {
            firstCard.classList.remove('flipped');
            secondCard.classList.remove('flipped');
            resetBoard();
        }, 1200); 
    }

    function resetBoard() {
        [hasFlippedCard, lockBoard] = [false, false];
        [firstCard, secondCard] = [null, null];
    }

    function checkWin() {
        const allMatched = document.querySelectorAll('.card.matched');
        if (allMatched.length === cardsArray.length) {
            setTimeout(() => {
                document.getElementById('winModal').classList.add('show');
            }, 500);
        }
    }

    function restartGame() {
        document.getElementById('winModal').classList.remove('show');
        resetBoard();
        createBoard();
    }

    function closePage() {
        window.close();
        setTimeout(() => {
            alert("由於瀏覽器安全限制，請直接手動關閉此分頁，或點擊「再玩一次」繼續挑戰！");
        }, 100);
    }

    createBoard();
</script>

</body>
</html>
