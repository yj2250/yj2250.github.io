<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人體器官功能記憶挑戰 🏥</title>
    <style>
        /* === 1. 全局與極致深色背景 === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12161a; 
            color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #4fd1c5; 
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .info-panel {
            margin-bottom: 20px;
            font-size: 15px;
            color: #a0aec0;
            text-align: center;
        }

        /* === 2. 遊戲畫布排版 === */
        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 100px); 
            grid-gap: 14px;
            margin-top: 10px;
        }

        /* === 3. 卡牌極致細節與 3D 設定 === */
        .card {
            width: 100px;
            height: 120px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;
            border-radius: 12px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 卡牌背面：高雅暗色調配質感紅十字 */
        .card-back {
            background-color: #1e2530;
            border: 1px solid rgba(79, 209, 197, 0.2); 
        }

        /* 卡牌正面：極簡洗鍊的白底 */
        .card-front {
            background-color: #f8f9fa;
            color: #1a202c;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
            transform: rotateY(180deg);
        }

        /* 專屬圖示卡的微調樣式 */
        .card-front.icon-only svg {
            width: 44px;
            height: 44px;
            margin-bottom: 8px;
        }
        
        .card-front.icon-only span {
            font-size: 13px;
            color: #4a5568;
            letter-spacing: 1px;
        }

        /* 成功配對後的淡出 */
        .card.matched {
            cursor: default;
            opacity: 0.25; 
            transition: opacity 0.6s;
        }

        /* === 4. 中央通關彈出視窗 (Modal) === */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #1e2530;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 400px;
            width: 80%;
            border: 1px solid #4fd1c5;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            color: #4fd1c5;
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .modal-content p {
            color: #cbd5e0;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            margin: 0 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-restart {
            background-color: #4fd1c5;
            color: #12161a;
        }
        .btn-restart:hover { 
            background-color: #38b2ac;
            box-shadow: 0 0 12px rgba(79, 209, 197, 0.4);
        }

        .btn-close {
            background-color: #e53e3e;
            color: white;
        }
        .btn-close:hover { background-color: #c53030; }
    </style>
</head>
<body>
