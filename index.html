<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人體器官功能記憶挑戰 🏥</title>
    <style>
        /* === 1. 全局與極致深色背景 === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12161a; 
            color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #4fd1c5; 
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .info-panel {
            margin-bottom: 20px;
            font-size: 15px;
            color: #a0aec0;
            text-align: center;
        }

        /* === 2. 遊戲畫布排版 === */
        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 100px); 
            grid-gap: 14px;
            margin-top: 10px;
        }

        /* === 3. 卡牌細節與 3D 設定 === */
        .card {
            width: 100px;
            height: 120px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;
            border-radius: 12px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 卡牌背面：暗色調配質感紅十字 */
        .card-back {
            background-color: #1e2530;
            border: 1px solid rgba(79, 209, 197, 0.2); 
        }

        /* 卡牌正面：極簡白底 */
        .card-front {
            background-color: #f8f9fa;
            color: #1a202c;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
            transform: rotateY(180deg);
        }

        /* 專屬圖示卡的樣式 */
        .card-front.icon-only svg {
            width: 44px;
            height: 44px;
            margin-bottom: 8px;
        }
        
        .card-front.icon-only span {
            font-size: 13px;
            color: #4a5568;
            letter-spacing: 1px;
        }

        /* 成功配對後的淡出 */
        .card.matched {
            cursor: default;
            opacity: 0.25; 
            transition: opacity 0.6s;
        }

        /* === 4. 中央通關彈出視窗 (Modal) === */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
